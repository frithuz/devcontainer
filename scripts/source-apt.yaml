# yaml-language-server: $schema=schemas/source-apt.schema.json
#
# deb-src repositories for the apt packages the image installs, for scripts/collect-source.sh,
# which asks apt for each copyleft package's source package at its exact version. Docker's apt
# repository publishes no source packages, and none of its packages is copyleft.
repositories:
  # Docker's hardened rebuilds (+dhi versions). Most of the base image and the installed
  # packages come from here; the rest from Debian's archive.
  - name: dhi
    url: https://dhi.io/deb/debian/main
    suites: [trixie]
    components: [main]
    signedBy: /usr/share/keyrings/dhi-deb-main.gpg

  - name: debian
    url: https://deb.debian.org/debian
    suites: [trixie, trixie-updates]
    components: [main]
    signedBy: /usr/share/keyrings/debian-archive-keyring.pgp

  - name: debian-security
    url: https://deb.debian.org/debian-security
    suites: [trixie-security]
    components: [main]
    signedBy: /usr/share/keyrings/debian-archive-keyring.pgp
