# yaml-language-server: $schema=schemas/license-evidence.schema.json
#
# Reviewed license texts that scripts/collect-legal.sh adds to Go modules' /legal/go/pkg/mod/
# directories, beside every license file it already copies from the module. Only for modules
# whose notices name a license whose text Syft can't see: Syft reads license-named files at the
# top of a module directory only, so a text kept in a subdirectory, under another name, or only
# linked from a NOTICE leaves that license out of the SBOM attestation. Nothing here replaces or
# removes an upstream file.
#
# Each entry is pinned to the upstream text that was reviewed. It applies to every version of the
# module in the image that has any of the reviewed files: if one of them differs or is missing,
# the build fails until the entry is reviewed again. A version with none of them (one that
# predates the code) is skipped and logged. An entry no version applies to fails the build, so
# the list can't go stale.
modules:
  - module: go.yaml.in/yaml/v4
    reason: >-
      NOTICE says the files ported from libyaml (internal/libyaml/*) stay under libyaml's MIT
      license, but only links the text. go-yaml's v2 branch ships that text as LICENSE.libyaml.
    reviewed:
      - file: NOTICE
        sha256: 257bb2d062ee0b9226e3b5f9c3c5d6aa3d38a450df27a9e060f061d4d4a4eb6f
    add:
      - as: LICENSE.libyaml
        url: https://raw.githubusercontent.com/yaml/go-yaml/43b627a9da72517e91dbcf07cd10dfd6618423d8/LICENSE.libyaml
        sha256: a94710b55e03b5285f77d048c5ba61bb9d6ee04a06c0eb90e68821e11b0c707a

  - module: github.com/moby/spdystream
    reason: >-
      NOTICE says spdy/ is derived from golang.org/x/net under the BSD 3-Clause license, with
      the license and patent grant in spdy/LICENSE and spdy/PATENTS.
    reviewed:
      - file: NOTICE
        sha256: 45e765737ec9a50bedb8420d4d0cae61486d11ea8f5687edfa9b6dfdf57cc54a
    include:
      - path: spdy/LICENSE
        as: LICENSE.spdy
      - path: spdy/PATENTS
        as: PATENTS.spdy

  - module: github.com/ishidawataru/sctp
    reason: >-
      NOTICE says ipsock_linux.go is the Go authors' code under the license in GO_LICENSE (BSD).
    reviewed:
      - file: NOTICE
        sha256: 4da03d33028f02f6db03bb402cb9aedf45df8746e943ab58afd1b86919f1ca0b
    include:
      - path: GO_LICENSE
        as: LICENSE.GO_LICENSE

  # Licenses kept in a subdirectory for code linked into the image (forked Go code and the like).
  # The text is already shipped at its upstream path; the entry adds it at the top for Syft.
  - module: github.com/andybalholm/brotli
    reason: >-
      The code in flate/ is the Go authors', under the BSD 3-Clause license in flate/LICENSE. It
      is linked into the image.
    reviewed:
      - file: flate/LICENSE
        sha256: 2d36597f7117c38b006835ae7f537487207d8ec407aa9d9980794b2030cbc067
    include:
      - path: flate/LICENSE
        as: LICENSE.flate

  - module: github.com/aws/aws-sdk-go-v2
    reason: >-
      The code in internal/sync/singleflight/ is the Go authors', under the BSD 3-Clause license
      in internal/sync/singleflight/LICENSE. It is linked into the image.
    reviewed:
      - file: internal/sync/singleflight/LICENSE
        sha256: f5122de47ce62d57dcd3e57cdf778ceacc3a847645de3332fea58903def93ecb
    include:
      - path: internal/sync/singleflight/LICENSE
        as: LICENSE.singleflight

  - module: github.com/aws/smithy-go
    reason: >-
      The code in internal/sync/singleflight/ is the Go authors', under the BSD 3-Clause license
