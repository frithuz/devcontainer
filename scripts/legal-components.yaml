# yaml-language-server: $schema=schemas/legal-components.schema.json
#
# Components copied from pinned upstream images or built from pinned Go modules, for
# scripts/collect-legal.sh. Adding a COPY'd tool to the Dockerfile requires an entry here. Pinned
# digests are read from the Dockerfile's FROM lines by stage name, so they live in one place; a
# go-install component's module and version come from the binary's build info, and a release
# component's archive from the SOURCE its stage writes. The "base" stage lists files
# Ubuntu's base image ships outside any apt package. In upstream and purl, {version} is the
# installed version, as printed by the version command.
components:
  - name: go
    stage: go
    license: BSD-3-Clause
    version: go env GOVERSION
    notices: [/legal/attribution/go/LICENSE, /legal/attribution/go/PATENTS]
    paths: [/usr/local/go]

  - name: rust
    stage: rust
    # rustc, cargo, the standard library, rustfmt, clippy, and rust-analyzer. LLVM is compiled into
    # rustc; COPYRIGHT.html lists the other third-party code each one bundles.
    license: (MIT OR Apache-2.0) AND Apache-2.0 WITH LLVM-exception
    version: rustc --version
    notices:
      - /legal/attribution/rust/rust/COPYRIGHT.html
      - /legal/attribution/rust/rust/licenses/*
      - /legal/attribution/rust/*/LICENSE-*
    paths: [/usr/local/rust]

  - name: node
    stage: node
    license: MIT
    version: node --version
    notices: [/legal/attribution/node/LICENSE]
    paths: [/usr/local/bin/node]
    upstream:
      repository: nodejs/node
      tag: v{version}
      files: [LICENSE]

  - name: python
    stage: python
    license: PSF-2.0
    version: python3 --version
    notices: [/legal/attribution/python/LICENSE.txt]
    paths:
      - /usr/local/bin/python3.15
      - /usr/local/lib/python3.15
      - /usr/local/lib/libpython3.15.so.1.0
      - /usr/local/lib/libpython3.so
      - /usr/local/include/python3.15

  - name: pip
    stage: python
    license: MIT
    version: pip3 --version
    notices: [/usr/local/lib/python3.15/site-packages/pip-*.dist-info/licenses/*]
    paths: [/usr/local/lib/python3.15/site-packages/pip]

  - name: uv
    stage: uv
    license: MIT OR Apache-2.0
    version: uv --version
    notices: [/legal/attribution/uv/LICENSE-*]
    paths: [/usr/local/bin/uv, /usr/local/bin/uvx]
    upstream:
      repository: astral-sh/uv
      tag: "{version}"
      files: [LICENSE-APACHE, LICENSE-MIT]

  - name: shfmt
    stage: shfmt
    license: BSD-3-Clause
    version: shfmt --version
    notices: [/legal/attribution/shfmt/LICENSE]
    paths: [/usr/local/bin/shfmt]
    upstream:
      repository: mvdan/sh
      tag: v{version}
      files: [LICENSE]

  - name: jq
    stage: jq
    license: MIT AND ICU AND BSD-2-Clause AND dtoa
    version: jq --version
    notices: [/legal/attribution/jq/COPYING]
    paths: [/usr/local/bin/jq]

  - name: yq
    stage: yq
    license: MIT
    version: yq --version
    notices: [/legal/attribution/yq/LICENSE]
    paths: [/usr/local/bin/yq]
    upstream:
      repository: mikefarah/yq
      tag: v{version}
      files: [LICENSE]

  - name: jv
    stage: jv
    install: go-install
    license: Apache-2.0
    version: jv --version
    notices: [/legal/attribution/jv/LICENSE]
    paths: [/usr/local/bin/jv]

  - name: task
    stage: task
    install: release
    license: MIT
    version: task --version
    notices: [/legal/attribution/task/LICENSE]
    paths: [/usr/local/bin/task]

  - name: sampo
    stage: sampo
    install: release
    # Its Rust dependencies are permissive except option-ext (MPL-2.0), compiled in upstream.
    license: MIT
    version: sampo --version
    notices: [/legal/attribution/sampo/LICENSE]
    paths: [/usr/local/bin/sampo]
    purl: pkg:cargo/sampo@{version}

  - name: dnslookup
    stage: dnslookup
    install: go-install
    license: MIT
    version: dnslookup --version
    notices: [/legal/attribution/dnslookup/LICENSE]
    paths: [/usr/local/bin/dnslookup]

  - name: gh-stack
    stage: gh-stack
    install: go-install
    license: MIT
    version: gh-stack --version
    notices: [/legal/attribution/gh-stack/LICENSE]
    paths: [/usr/local/bin/gh-stack]

  - name: gopls
    stage: gopls
    install: go-install
    license: BSD-3-Clause
    version: gopls version
    notices: [/legal/attribution/gopls/LICENSE]
    paths: [/usr/local/bin/gopls]

  - name: delve
    stage: delve
    install: go-install
    license: MIT
    version: dlv version
    notices: [/legal/attribution/delve/LICENSE]
    paths: [/usr/local/bin/dlv]

  - name: staticcheck
    stage: staticcheck
    install: go-install
    license: MIT
    # Prints its release name first: "staticcheck 2026.2.2 (0.8.2)".
    version: staticcheck -version
    version-after: "("
    notices: [/legal/attribution/staticcheck/LICENSE]
    paths: [/usr/local/bin/staticcheck]

  - name: govulncheck
    stage: govulncheck
    install: go-install
    license: BSD-3-Clause
    # Prints the Go toolchain's version first.
    version: govulncheck -version
    version-after: govulncheck@
    notices: [/legal/attribution/govulncheck/LICENSE]
    paths: [/usr/local/bin/govulncheck]

  - name: buf
    stage: buf
    # A static Go build (CGO_ENABLED=0), so copying it from upstream's Alpine image is safe.
    license: Apache-2.0
    version: buf --version
    notices: [/legal/attribution/buf/LICENSE]
    paths: [/usr/local/bin/buf]
    upstream:
      repository: bufbuild/buf
      tag: v{version}
      files: [LICENSE]

  - name: protoc
    stage: protoc
    install: source-build
    # protobuf (BSD-3-Clause) with its bundled utf8_range (MIT); Abseil is recorded as embedded.
    license: BSD-3-Clause AND MIT
    version: protoc --version
    notices: [/legal/attribution/protoc/LICENSE, /legal/attribution/protoc/utf8_range/LICENSE]
    paths: [/usr/local/bin/protoc, /usr/local/include/google/protobuf]
    purl: pkg:generic/protobuf@{version}

  - name: ast-grep
    stage: ast-grep
    install: release
    # Its Rust dependencies are permissive except option-ext (MPL-2.0), compiled in upstream.
    license: MIT
    version: ast-grep --version
    notices: [/legal/attribution/ast-grep/LICENSE]
    paths: [/usr/local/bin/ast-grep]
    purl: pkg:cargo/ast-grep@{version}

  - name: hyperfine
    stage: hyperfine
    install: release
    # Its Rust dependencies are permissive except colored (MPL-2.0), compiled in upstream.
    license: MIT OR Apache-2.0
    version: hyperfine --version
    notices: [/legal/attribution/hyperfine/LICENSE-*]
    paths: [/usr/local/bin/hyperfine]
    purl: pkg:cargo/hyperfine@{version}

  - name: git-cliff
    stage: git-cliff
    license: MIT OR Apache-2.0
    version: git-cliff --version
    notices: [/legal/attribution/git-cliff/LICENSE-*]
    paths: [/usr/local/bin/git-cliff]
    upstream:
      repository: orhun/git-cliff
      tag: v{version}
      files: [LICENSE-APACHE, LICENSE-MIT]
    purl: pkg:cargo/git-cliff@{version}

  - name: betterleaks
    stage: betterleaks
    license: MIT
    version: betterleaks version
    notices: [/legal/attribution/betterleaks/LICENSE]
    paths: [/usr/local/bin/betterleaks]
    upstream:
      repository: betterleaks/betterleaks
      tag: v{version}
      files: [LICENSE]

  - name: dbmate
    stage: dbmate
    # A static cgo build on Alpine: musl (MIT) and SQLite (public domain, in go-sqlite3) are
    # compiled in.
    license: MIT
    version: dbmate --version
    notices: [/legal/attribution/dbmate/LICENSE]
    paths: [/usr/local/bin/dbmate]
    upstream:
      repository: amacneil/dbmate
      tag: v{version}
      files: [LICENSE]

  - name: git
    stage: git
    install: source-build
    # The Rust standard library is compiled in (Apache-2.0 OR MIT, notices in rust/).
    license: GPL-2.0-only AND (Apache-2.0 OR MIT)
    version: git --version
    notices:
      - /legal/attribution/git/COPYING
      - /legal/attribution/git/LGPL-2.1
      - /legal/attribution/git/rust/COPYRIGHT-library.html
      - /legal/attribution/git/rust/licenses/*
    paths:
      - /usr/local/bin/git
      - /usr/local/bin/scalar
      - /usr/local/libexec/git-core
      - /usr/local/share/git-core
    purl: pkg:generic/git@{version}

  - name: pnpm
    stage: pnpm
    license: MIT
    version: pnpm --version
    notices: [/legal/attribution/pnpm/LICENSE]
    paths:
      - /opt/pnpm/pnpm
      - /opt/pnpm/pn
      - /opt/pnpm/pnpx
      - /opt/pnpm/pnx
      - /opt/pnpm/dist
    upstream:
      repository: pnpm/pnpm
      tag: v{version}
      files: [LICENSE]
    purl: pkg:npm/pnpm@{version}
