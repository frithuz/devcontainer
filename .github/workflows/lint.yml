name: lint
run-name: >-
  ${{ github.event_name == 'pull_request'
      && format('Lint PR #{0}: {1}', github.event.pull_request.number, github.event.pull_request.title)
      || format('Lint {0}', github.ref_name) }}

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    name: Lint workflows
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The linters run in the background of each other, so both always run. The job's implicit
      # wait-all at the end fails it if either one fails.

      # Uses .github/actionlint.yaml. The image includes shellcheck, which checks the run: scripts.
      - name: Run actionlint
        id: actionlint
        background: true
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

      # Any finding at the auditor persona fails the step. Findings show as annotations instead of
      # code scanning alerts, which would need security-events: write and don't fail the run.
      - name: Run zizmor
        id: zizmor
        background: true
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.31.1
          persona: auditor
          advanced-security: false
          annotations: true

  # The repository's own tools, from the image the repository publishes. Pinned by hand: Dependabot
  # doesn't update container: images, and kits.yml's GITHUB_TOKEN can't push workflow changes
  # (docs/maintenance.md#updates-dependabot-cant-handle).
  repository:
    name: Lint the repository
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    container:
      image: ghcr.io/frithuz/devcontainer:build-40358718718@sha256:1598abcab8bf07ec98e0edea830d77177cf82d1c3cfff9027dd02a769cdd2454
      options: --user root
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # betterleaks scans every commit.
          fetch-depth: 0
          persist-credentials: false

      # Like the workflow linters, each tool runs in the background of the others, so all of them
      # always run.

      # Uses .hadolint.yaml.
      - name: Run hadolint
        id: hadolint
        background: true
        run: hadolint Dockerfile source.Dockerfile sandboxes/*/*.dockerfile

      # Every shell script shfmt recognizes, by extension or shebang, including the bats tests.
      - name: Run shfmt
        id: shfmt
        background: true
        run: shfmt --diff .

      # The checkout belongs to the runner's user, not root, so git needs it marked safe
      # (docs/usage.md#github-actions). betterleaks runs git without the global and system config,
      # so it's passed through git's environment instead.
      - name: Run betterleaks
        id: betterleaks
        background: true
        run: |
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" \
            betterleaks git --no-banner --redact --verbose .
