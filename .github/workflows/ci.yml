# Checks a PR's image before it can be published (docs/maintenance.md#ci-ciyml-on-every-pr).
# lint.yml lints the repository and the workflows.
name: ci
run-name: >-
  ${{ format('CI PR #{0}: {1}', github.event.pull_request.number, github.event.pull_request.title) }}

on:
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Builds the image natively on each architecture and loads it into the runner's daemon, then
  # runs the smoke tests inside the build (the preflight target) and the DinD checks in a
  # privileged container with no host socket. The image build reads publish's cache for that
  # platform, and writes none, so PRs never evict it. preflight reuses its layers from the builder.
  # Pulling the base from dhi.io needs DOCKERHUB_TOKEN, which a fork's PR can't read, so fork PRs
  # skip the image checks (docs/maintenance.md#ci-ciyml-on-every-pr).
  image:
    name: Image checks (${{ matrix.arch }})
    if: github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The base is pulled from dhi.io. Dependabot's PRs read DOCKERHUB_TOKEN from Dependabot's
      # secrets, everything else from the repository's. It's a repository secret rather than an
      # environment's because publish.yml's bake.yml jobs need it too, and a job calling a reusable
      # workflow can't use an environment (docs/maintenance.md#registry-and-signing).
      - name: Log in to dhi.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: dhi.io
          username: garbee
          password: ${{ secrets.DOCKERHUB_TOKEN }} # zizmor: ignore[secrets-outside-env]

      # publish.yml's bake.yml caches the image target under image-linux-<arch>.
      - name: Build the image
        id: image
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          targets: image
          load: true
          vars: |
            NATIVE=true
            REVISION=${{ github.sha }}
          set: |
            image.cache-from=type=gha,scope=image-linux-${{ matrix.arch }}

      # For the sources-plan job, uploaded before the DinD checks so it runs even when they fail.
      - name: Copy the manifest out of the image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "out/manifests/linux_$ARCH"
          docker run --rm --entrypoint cat devcontainer:local /legal/manifest.tsv >"out/manifests/linux_$ARCH/manifest.tsv"

      - name: Upload the manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manifest-${{ matrix.arch }}
          path: out/manifests/
          if-no-files-found: error

      # The smoke tests run in the build, which exports their report and exit status to
      # out/preflight/ instead of failing, so the report is shown either way. The image's layers
      # come from the build above, in the same builder, given the same vars.
      - name: Run the smoke tests
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          targets: preflight
          vars: |
            NATIVE=true
            REVISION=${{ github.sha }}

      - name: Report the smoke tests
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          status=$(cat out/preflight/smoke-status)
          {
            echo "## Smoke tests (linux/$ARCH)"
            echo
            echo "- Passed: $(grep -c '^ok' out/preflight/smoke.txt)"
            echo "- Failed: $(grep -c '^not ok' out/preflight/smoke.txt)"
            if ((status != 0)); then
              echo
              echo '```text'
              grep -v '^ok' out/preflight/smoke.txt
              echo '```'
            fi
          } >>"$GITHUB_STEP_SUMMARY"
          while IFS= read -r line; do
            echo "::error title=Smoke test (linux/$ARCH)::${line#not ok - }"
          done < <(grep '^not ok' out/preflight/smoke.txt || true)
          exit "$status"

      # Anonymous volumes, removed with the container, so the daemon's data is exclusive to it.
      # Runs even when the smoke tests fail, as long as the image built.
      - name: Run the DinD checks
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: |
          docker run --rm --privileged --user agent \
            --mount type=volume,target=/var/lib/docker \
            --mount type=volume,target=/var/lib/containerd \
            --mount "type=bind,source=$GITHUB_WORKSPACE/test,target=/mnt/test,readonly" \
            devcontainer:local bash /mnt/test/runtime.sh

  # Resolves every copyleft component's exact source from the PR's manifests, so a component
  # whose source can't be resolved fails the PR instead of the publish
  # (docs/legal.md#source-images). Nothing is fetched or built.
  sources-plan:
    name: Plan the source images
    needs: image
    # Needs only the manifests, which image uploads before its tests. Skipped with image on forks.
    if: ${{ !cancelled() && needs.image.result != 'skipped' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # build-sources.sh keys source images on the last commit that changed the recipe.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Download the manifests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: manifest-*
          path: out/manifests
          merge-multiple: true

      # A failed build leaves out a platform, and a plan from the other alone would pass.
      - name: Check both platforms
        run: |
          for arch in amd64 arm64; do
            if [[ ! -s out/manifests/linux_$arch/manifest.tsv ]]; then
              echo "::error::No manifest for linux/$arch; its image job didn't build the image"
              exit 1
            fi
          done

      # Tags already published with the same key show as reused. The plan lists them anonymously.
      - name: Plan the source images
        env:
          MANIFESTS: out/manifests
          SOURCE_REUSE: ghcr.io/frithuz/devcontainer
        run: scripts/build-sources.sh --plan-only

      - name: Summary
        run: |
          {
            echo "## Source images"
            echo
            echo "| Status | Tag | Root | Version |"
            echo "| --- | --- | --- | --- |"
            awk -F'\t' 'NR > 1 {
              gsub(/\|/, "\\|")
              print "| " $1 " | " ($2 == "-" ? "-" : "`" $2 "`") " | " $5 " | " $6 " |"
            }' out/sources/plan.tsv
          } >>"$GITHUB_STEP_SUMMARY"
