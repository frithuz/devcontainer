# Builds the image once and publishes it (docs/maintenance.md#publishing).
#
# A run builds only when the image would materially change from Quay's latest: its build inputs
# changed, or a refresh changed its inventory (docs/maintenance.md#material-changes). Otherwise
# nothing is pushed. A build pushes to GHCR under the recovery tag build-<run id>. Pushes to main,
# scheduled refreshes, and manual runs that ask for it also tag :latest, are signed on GHCR with
# the OpenBao-held cosign key (docs/integrations/openbao.md), and are promoted with the signature
# to Quay and registry.frithuz.dev.
# Not yet implemented: automatic public tags (:main, :YYYYMMDD) and verify, the smoke tests
# against the published digest (docs/maintenance.md#publishing). After a promotion that tags
# latest, kits.yml opens a PR that points the sandbox kits at the image.
name: publish
run-name: >-
  ${{ github.event_name == 'push'
      && format('Publish {0}', github.ref_name)
      || github.event_name == 'schedule'
      && format('Publish {0} — weekly refresh', github.ref_name)
      || format('Publish {0} — manual{1} by @{2}', github.ref_name, inputs.refresh && ' refresh' || '', github.actor) }}

on:
  # Every push runs, and the changes job decides from scripts/image-changes.sh's build inputs. A
  # push that doesn't touch them, such as docs or a merged kits PR, stops there.
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      refresh:
        description: Refresh the apt packages and agent installs, like the weekly build
        type: boolean
        default: false
      latest:
        description: Also tag the built image as latest, and promote it to Quay and registry.frithuz.dev
        type: boolean
        default: false
      force:
        description: Build and publish even without a material change from Quay's latest
        type: boolean
        default: false

permissions: {}

# setup-oras only knows the releases bundled with it, which can lag behind ORAS, so the jobs
# install the release archive by URL. Take the checksum from the release's checksums.txt.
env:
  ORAS_URL: https://github.com/oras-project/oras/releases/download/v1.3.6/oras_1.3.6_linux_amd64.tar.gz
  ORAS_CHECKSUM: 66fb0ad7206f3f6fa77ed5b552049d364ccf4b50b1684554f731f76302b52ca0

# Runs and repairs share one group, and a run in progress is never cancelled.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # The image's base.name and base.digest come from the image stage's FROM line. It stays a
  # literal pin, rather than an ARG, because Dependabot doesn't update FROM lines that use one.
  base:
    name: Read the base image
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    outputs:
      name: ${{ steps.base.outputs.name }}
      digest: ${{ steps.base.outputs.digest }}
    steps:
      - name: Check out the Dockerfile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: Dockerfile
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # The image stage starts FROM debian, the stage pinning the base. A Docker Hub short name is
      # written out in full: debian is docker.io/library/debian.
      - name: Read the base stage's FROM
        id: base
        run: |
          ref=$(awk '$1 == "FROM" && $3 == "AS" && $4 == "debian" { print $2 }' Dockerfile)
          if [[ ! $ref =~ ^([^@]+)@(sha256:[0-9a-f]{64})$ ]]; then
            echo "::error file=Dockerfile::The debian stage's FROM isn't a single <name>@sha256:<digest> pin: ${ref:-none}"
            exit 1
          fi
          name=${BASH_REMATCH[1]} digest=${BASH_REMATCH[2]}
          first=${name%%/*}
          if [[ $name != */* ]]; then
            name=docker.io/library/$name
          elif [[ $first != *.* && $first != *:* && $first != localhost ]]; then
            name=docker.io/$name
          fi
          echo "name=$name" >>"$GITHUB_OUTPUT"
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
          echo "$name@$digest"

  # Compares this commit's build inputs with those of the commit Quay's latest was built from.
  # Changed inputs, or force, build. Unchanged inputs on a refresh compare the inventory first.
  # Unchanged inputs otherwise stop here: nothing could change, short of a cache miss.
  changes:
    name: Compare with the published image
    # One-push rollout escape hatch; schedules and manual runs remain enabled.
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip main image]')
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    outputs:
      decision: ${{ steps.decide.outputs.decision }}
      published: ${{ steps.published.outputs.ref }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The published image's commit can be anywhere in main's history. The diff fetches only
          # the blobs it needs.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      # Resolved once, so every comparison in the run reads the same image. force skips the
      # lookups, so it can publish when there's no latest to compare with.
      - name: Resolve Quay's latest
        id: published
        if: ${{ !inputs.force }}
        run: |
          digest=$(docker buildx imagetools inspect quay.io/frithuz/devcontainer:latest --format '{{json .Manifest}}' | jq -er .digest)
          echo "ref=quay.io/frithuz/devcontainer@$digest" >>"$GITHUB_OUTPUT"

      - name: Decide
        id: decide
        env:
          PUBLISHED: ${{ steps.published.outputs.ref }}
          FORCE: ${{ inputs.force || false }}
          REFRESH: ${{ github.event_name == 'schedule' || inputs.refresh || false }}
        run: |
          changed=-
          [[ $FORCE == true ]] || changed=$(scripts/image-changes.sh inputs "$PUBLISHED")
          if [[ $FORCE == true || $changed == true ]]; then
            decision=build
          elif [[ $REFRESH == true ]]; then
            decision=compare
          else
            decision=skip
          fi
          echo "decision=$decision" >>"$GITHUB_OUTPUT"
          {
            echo "## Compared with $PUBLISHED"
            echo
            echo "- Build inputs changed: $changed"
            echo "- Forced: $FORCE"
            echo "- Refresh: $REFRESH"
            echo "- Decision: **$decision**"
          } >>"$GITHUB_STEP_SUMMARY"

  # A refresh with unchanged inputs builds the preflight target first, which pushes nothing and
  # exports each platform's /legal/manifest.tsv. It also runs the smoke tests, but records their
  # result instead of failing, so they never block the comparison. It shares build's cache scope (bake.yml defaults
  # to the target's name) and vars, so build reuses the refreshed layers instead of rerunning them.
  preflight:
    name: Build the inventory
    needs: [base, changes]
    if: needs.changes.outputs.decision == 'compare'
    uses: docker/github-builder/.github/workflows/bake.yml@cbc9d42f8c89a55623392aadd03600965b80e963 # v1.18.1
    permissions:
      contents: read
      id-token: write # signed cache entries
    with:
      target: preflight
      output: local
      # Logs in to pull the base from dhi.io. By default bake.yml logs in only to push an image.
      registry-login: "true"
      artifact-upload: true
      artifact-name: preflight
      sign: "false"
      cache: true
      cache-scope: image
      cache-mode: max
      vars: |
        REVISION=${{ github.sha }}
        REPOSITORY_URL=${{ github.server_url }}/${{ github.repository }}
        BASE_NAME=${{ needs.base.outputs.name }}
        BASE_DIGEST=${{ needs.base.outputs.digest }}
        REFRESH=${{ (github.event_name == 'schedule' || inputs.refresh) && github.run_id || '' }}
    secrets:
      registry-auths: |
        - registry: dhi.io
          username: garbee
          password: ${{ secrets.DOCKERHUB_TOKEN }}

  inventory:
    name: Compare the inventory
    needs: [changes, preflight]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Download the inventory
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: preflight
          path: out/preflight

      - name: Compare with the published inventory
        id: compare
        env:
          PUBLISHED: ${{ needs.changes.outputs.published }}
        run: |
          status=0
          changed=$(scripts/image-changes.sh inventory "$PUBLISHED" out/preflight 2>inventory.txt) || status=$?
          cat inventory.txt
          ((status == 0)) || exit "$status"
          echo "changed=$changed" >>"$GITHUB_OUTPUT"
          {
            echo "## Inventory compared with $PUBLISHED"
            echo
            echo "- Changed: **$changed**"
            echo
            echo '```text'
            cat inventory.txt
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

  # A skipped preflight skips inventory, so the jobs from here on state their own conditions:
  # by default a job is skipped whenever any job it depends on, however indirectly, was.
  build:
    name: Build and push to GHCR
    needs: [base, changes, inventory]
    if: >-
      !cancelled() && needs.base.result == 'success' && needs.changes.result == 'success'
      && (needs.changes.outputs.decision == 'build' || needs.inventory.outputs.changed == 'true')
    uses: docker/github-builder/.github/workflows/bake.yml@cbc9d42f8c89a55623392aadd03600965b80e963 # v1.18.1
    permissions:
      contents: read
      packages: write # push the image to GHCR
      id-token: write # signing, and signed cache entries
    with:
      target: image
      output: image
      push: true
      sbom: true
      cache: true
      cache-mode: max
      # REFRESH changes on scheduled (and requested) runs to re-run every RUN step of the image
      # stage (docs/architecture.md#dockerfile-structure).
      vars: |
        REVISION=${{ github.sha }}
        REPOSITORY_URL=${{ github.server_url }}/${{ github.repository }}
        BASE_NAME=${{ needs.base.outputs.name }}
        BASE_DIGEST=${{ needs.base.outputs.digest }}
        REFRESH=${{ (github.event_name == 'schedule' || inputs.refresh) && github.run_id || '' }}
      meta-images: ghcr.io/${{ github.repository_owner }}/devcontainer
      meta-tags: |
        type=raw,value=build-${{ github.run_id }}
        type=raw,value=latest,enable=${{ github.event_name != 'workflow_dispatch' || inputs.latest }}
      # finalize assembles the multi-platform index, and only these annotations reach it. They're
      # added to metadata-action's standard OCI annotations, and replace any with the same key.
      # GHCR shows the index's description. Keep it, and the vendor, the same as the Dockerfile's
      # labels, and the rest the same as docker-bake.hcl's.
      set-meta-annotations: true
      meta-annotations: |
        org.opencontainers.image.description=Debian 13 (Docker Hardened Images) image with one pinned toolset for devcontainers, GitHub Actions CI, and agent sandboxes. Copyleft source locations are listed in /legal/source.tsv; see /legal/SOURCE.md.
        org.opencontainers.image.vendor=frithuz
        org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/docs/usage.md
        org.opencontainers.image.base.name=${{ needs.base.outputs.name }}
        org.opencontainers.image.base.digest=${{ needs.base.outputs.digest }}
    secrets:
      # dhi.io for the base, GHCR for the push.
      registry-auths: |
        - registry: dhi.io
          username: garbee
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  # Signs the index digest on GHCR with the cosign key OpenBao holds, before anything is promoted.
  # The index lists the attestation manifests by digest, so the one signature covers the image, its
  # SBOM, and its provenance. GHCR has no Referrers API, so cosign stores the signature under the
  # index's sha256-<digest> fallback tag, and the promote jobs copy it with the other referrers
  # (docs/integrations/openbao.md). bake.yml's keyless signatures stay as they are.
  sign:
    name: Sign on GHCR
    needs: build
    # Under the same condition as the promote jobs, which need the signature: only runs that tag
    # latest are signed.
    if: >-
      !cancelled() && needs.build.result == 'success'
      && (github.event_name != 'workflow_dispatch' || inputs.latest)
    runs-on: ubuntu-26.04
    # OpenBao's cosign-sign role trusts only this environment's OIDC subject, and only main can
    # deploy to it (docs/integrations/openbao.md).
    environment: registry.frithuz.dev
    permissions:
      contents: read
      packages: write # push the signature to GHCR
      id-token: write # OpenBao JWT login
    defaults:
      run:
        shell: bash
    env:
      DIGEST: ${{ needs.build.outputs.digest }}
      OPENBAO_ADDR: https://vault.frithuz.dev
      OPENBAO_AUDIENCE: vault.frithuz.dev
      OPENBAO_ROLE: cosign-sign
    steps:
      - name: Check out the public key
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: cosign.pub
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # The installer checks the release it installs against its own pinned bootstrap release.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      - name: Set the GHCR repository
        run: echo "GHCR_REPOSITORY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/devcontainer" >>"$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Exchanges the job's OIDC token for an OpenBao batch token that can only sign with the cosign
      # key, and lasts ten minutes without renewal, so it's requested right before signing. A
      # rejected login reports OpenBao's status and body, which carry no secrets.
      - name: Log in to OpenBao
        run: |
          oidc=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$OPENBAO_AUDIENCE" | jq -er .value)
          echo "::add-mask::$oidc"
          response=$(jq -n --arg role "$OPENBAO_ROLE" --arg jwt "$oidc" '{role: $role, jwt: $jwt}' |
            curl -sS -X POST --data @- -w '\n%{http_code}' "$OPENBAO_ADDR/v1/auth/jwt-github/login")
          status=${response##*$'\n'}
          body=${response%$'\n'*}
          if [[ $status != 200 ]]; then
            echo "::error::OpenBao login returned HTTP $status: $body"
            exit 1
          fi
          token=$(jq -er .auth.client_token <<<"$body")
          echo "::add-mask::$token"
          # cosign's hashivault KMS reads these. TRANSIT_SECRET_ENGINE_PATH defaults to "transit".
          {
            echo "VAULT_ADDR=$OPENBAO_ADDR"
            echo "VAULT_TOKEN=$token"
          } >>"$GITHUB_ENV"

      # The signing key never leaves OpenBao: cosign sends it the digest to sign. cosign also
      # records the signature in the public Rekor log, which gives it a trusted timestamp.
      - name: Sign the image
        run: cosign sign --yes --key hashivault://cosign "$GHCR_REPOSITORY@$DIGEST"

      # Against the committed public key, so a signature that wouldn't verify fails the run before
      # anything is promoted.
      - name: Verify the signature
        run: cosign verify --key cosign.pub "$GHCR_REPOSITORY@$DIGEST" >/dev/null

      - name: Summary
        run: |
          {
            echo "## Signed on GHCR"
            echo
            echo "- Image: \`$GHCR_REPOSITORY:build-$GITHUB_RUN_ID@$DIGEST\`"
            echo "- Verify: \`cosign verify --key cosign.pub <image>@$DIGEST\`"
          } >>"$GITHUB_STEP_SUMMARY"

  promote:
    name: Promote to Quay
    needs: [build, sign]
    # Only runs that tag latest go to Quay. Every other run stays on GHCR. Keep this in step with
    # the build's latest tag. The signature has to be on GHCR first, since the copy carries it.
    if: >-
      !cancelled() && needs.build.result == 'success' && needs.sign.result == 'success'
      && (github.event_name != 'workflow_dispatch' || inputs.latest)
    runs-on: ubuntu-26.04
    # Quay's robot federation trusts only this environment's OIDC subject, and only main can
    # deploy to it (docs/integrations/quayio.md).
    environment: quay
    outputs:
      latest: ${{ steps.tag.outputs.latest }}
    permissions:
      contents: read
      packages: read # copy from GHCR
      id-token: write # Quay robot federation
    defaults:
      run:
        shell: bash
    env:
      DIGEST: ${{ needs.build.outputs.digest }}
      QUAY_ROBOT: frithuz+promote
      QUAY_AUDIENCE: quay
      QUAY_REPOSITORY: quay.io/frithuz/devcontainer
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up ORAS
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        with:
          url: ${{ env.ORAS_URL }}
          checksum: ${{ env.ORAS_CHECKSUM }}

      - name: Set the GHCR repository
        run: echo "GHCR_REPOSITORY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/devcontainer" >>"$GITHUB_ENV"

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      # Exchanges the job's OIDC token for a one-hour Quay token. No Quay credential is stored. The
      # audience must be one of the federation entry's OIDC audiences in Quay.
      - name: Log in to Quay with OIDC federation
        run: |
          oidc=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$QUAY_AUDIENCE" | jq -er .value)
          echo "::add-mask::$oidc"
          token=$(curl -fsS --user "$QUAY_ROBOT:$oidc" https://quay.io/oauth2/federation/robot/token | jq -er .token)
          echo "::add-mask::$token"
          printf '%s' "$token" | oras login quay.io --username "$QUAY_ROBOT" --password-stdin

      # Copied by digest, untagged. Referrers carry the signatures and attestations. Quay has the
      # Referrers API, so requiring it makes a Quay-side problem fail instead of creating fallback
      # tags.
      - name: Copy the image with its referrers
        run: oras cp -r --to-distribution-spec v1.1-referrers-api "$GHCR_REPOSITORY@$DIGEST" "$QUAY_REPOSITORY@$DIGEST"

      # latest is reported only once Quay has it, and the kits job runs only then. If latest is
      # gated again, gate it here, in TAGS.
      - name: Tag the image
        id: tag
        env:
          TAGS: build-${{ github.run_id }} latest
        run: |
          read -ra tags <<<"$TAGS"
          oras tag "$QUAY_REPOSITORY@$DIGEST" "${tags[@]}"
          for tag in "${tags[@]}"; do
            if [[ $tag == latest ]]; then
              echo "latest=true" >>"$GITHUB_OUTPUT"
            fi
          done

      - name: Summary
        run: |
          {
            echo "## Promoted to Quay"
            echo
            echo "- Image: \`$QUAY_REPOSITORY:build-$GITHUB_RUN_ID@$DIGEST\`"
          } >>"$GITHUB_STEP_SUMMARY"

  promote-frithuz:
    name: Promote to registry.frithuz.dev
    needs: [build, sign]
    # Runs alongside promote, under the same condition. Keep the two in step with the build's latest
    # tag.
    if: >-
      !cancelled() && needs.build.result == 'success' && needs.sign.result == 'success'
      && (github.event_name != 'workflow_dispatch' || inputs.latest)
    runs-on: ubuntu-26.04
    # The environment holds PNPR_TOKEN, and only main can deploy to it
    # (docs/integrations/registry-frithuz.md).
    environment: registry.frithuz.dev
    permissions:
      contents: read
      packages: read # copy from GHCR
    defaults:
      run:
        shell: bash
    env:
      DIGEST: ${{ needs.build.outputs.digest }}
      REGISTRY_HOST: registry.frithuz.dev
      REGISTRY_REPOSITORY: registry.frithuz.dev/frithuz/devcontainer
    steps:
      - name: Set up ORAS
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        with:
          url: ${{ env.ORAS_URL }}
          checksum: ${{ env.ORAS_CHECKSUM }}

      - name: Set the GHCR repository
        run: echo "GHCR_REPOSITORY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/devcontainer" >>"$GITHUB_ENV"

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      # pnpr takes a long-lived token for ci-frithuz, which may push to frithuz/* only. oras swaps it
      # at /v2/token for short repository-scoped tokens and refreshes them itself, so a long copy
      # doesn't outlive its login. Copied by digest, untagged, with the referrers that carry the
      # signatures and attestations.
      - name: Copy and tag the image
        env:
          PNPR_TOKEN: ${{ secrets.PNPR_TOKEN }}
          TAGS: build-${{ github.run_id }} latest
        run: |
          printf '%s' "$PNPR_TOKEN" | oras login "$REGISTRY_HOST" --username ci-frithuz --password-stdin
          oras cp -r --to-distribution-spec v1.1-referrers-api "$GHCR_REPOSITORY@$DIGEST" "$REGISTRY_REPOSITORY@$DIGEST"
          read -ra tags <<<"$TAGS"
          oras tag "$REGISTRY_REPOSITORY@$DIGEST" "${tags[@]}"

      - name: Summary
        run: |
          {
            echo "## Promoted to registry.frithuz.dev"
            echo
            echo "- Image: \`$REGISTRY_REPOSITORY:build-$GITHUB_RUN_ID@$DIGEST\`"
          } >>"$GITHUB_STEP_SUMMARY"

  # Hands the image to kits.yml, which opens or updates the kits PR. Only after Quay has tagged
  # it latest (docs/maintenance.md#sandbox-kits).
  kits:
    name: Update the sandbox kits
    needs: [build, promote]
    if: ${{ !cancelled() && needs.promote.outputs.latest == 'true' }}
    # actionlint 1.7.12 rejects the $/ self-repository form zizmor prefers.
    uses: ./.github/workflows/kits.yml # zizmor: ignore[self-repository]
    permissions:
      contents: write # push the update branch
      pull-requests: write # open or update the PR
    with:
      image: quay.io/frithuz/devcontainer:build-${{ github.run_id }}@${{ needs.build.outputs.digest }}
