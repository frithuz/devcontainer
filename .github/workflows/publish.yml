# Builds the image once and publishes it with its source images (docs/maintenance.md#publishing).
#
# For now this pushes to GHCR under the recovery tag build-<run id>. A manual run can also tag
# :latest, and only those runs are promoted to Quay. Not yet implemented: automatic public tags
# (:main, :latest, :YYYYMMDD) and verify (docs/legal.md#publishing).
name: publish
run-name: >-
  ${{ github.event_name == 'push'
      && format('Publish {0}', github.ref_name)
      || github.event_name == 'schedule'
      && format('Publish {0} — weekly refresh', github.ref_name)
      || format('Publish {0} — manual{1} by @{2}', github.ref_name, inputs.refresh && ' refresh' || '', github.actor) }}

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      refresh:
        description: Refresh the apt packages and agent installs, like the weekly build
        type: boolean
        default: false
      latest:
        description: Also tag the built image as latest, and promote it to Quay
        type: boolean
        default: false

permissions: {}

# setup-oras only knows the releases bundled with it, which can lag behind ORAS, so the jobs
# install the release archive by URL. Take the checksum from the release's checksums.txt.
env:
  ORAS_URL: https://github.com/oras-project/oras/releases/download/v1.3.6/oras_1.3.6_linux_amd64.tar.gz
  ORAS_CHECKSUM: 66fb0ad7206f3f6fa77ed5b552049d364ccf4b50b1684554f731f76302b52ca0

# Runs and repairs share one group, and a run in progress is never cancelled.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    name: Build and push to GHCR
    uses: docker/github-builder/.github/workflows/bake.yml@cbc9d42f8c89a55623392aadd03600965b80e963 # v1.18.1
    permissions:
      contents: read
      packages: write # push the image to GHCR
      id-token: write # signing, and signed cache entries
    with:
      target: image
      output: image
      push: true
      sbom: true
      cache: true
      cache-mode: max
      # REFRESH changes on scheduled (and requested) runs to re-run every RUN step of the image
      # stage (docs/architecture.md#dockerfile-structure).
      vars: |
        REVISION=${{ github.sha }}
        REFRESH=${{ (github.event_name == 'schedule' || inputs.refresh) && github.run_id || '' }}
      meta-images: ghcr.io/${{ github.repository_owner }}/devcontainer
      meta-tags: |
        type=raw,value=build-${{ github.run_id }}
        type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' && inputs.latest }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  sources:
    name: Publish source images
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write # push the source images and source indexes to GHCR
    defaults:
      run:
        shell: bash
    env:
      DIGEST: ${{ needs.build.outputs.digest }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # build-sources.sh keys source images on the last commit that changed the recipe.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Set up ORAS
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        with:
          url: ${{ env.ORAS_URL }}
          checksum: ${{ env.ORAS_CHECKSUM }}

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set the repository
        run: echo "REPOSITORY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/devcontainer" >>"$GITHUB_ENV"

      # Each platform's manifest comes from the pushed digest, never from a rebuild. COPY --from
      # doesn't run anything, so the other platform needs no emulation.
      - name: Copy the manifests out of the image
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 --output type=local,dest=out/manifests - <<EOF
          FROM scratch
          COPY --from=$REPOSITORY@$DIGEST /legal/manifest.tsv /
          EOF
          find out/manifests -name manifest.tsv

      # Source images already in the repository with the same key are reused, not rebuilt. The
      # plan lists the repository's tags anonymously, so the package must be public.
      - name: Build and push the source images
        env:
          MANIFESTS: out/manifests
          SOURCE_PUSH: "true"
        run: SOURCE_REPOSITORY=$REPOSITORY SOURCE_REUSE=$REPOSITORY scripts/build-sources.sh -- --progress=plain

      # One source index per subject, the image index and each platform manifest, so promote's
      # copy of the image carries its source to Quay (docs/legal.md#publishing). GHCR has no
      # Referrers API, so they're recorded in fallback tags. A retry keeps an identical source
      # index and fails on a different one.
      - name: Attach the source indexes
        run: scripts/source-indexes.sh attach --referrers tag out/sources/plan.tsv "$REPOSITORY" "$DIGEST" | tee out/sources/indexes.tsv

      - name: Summary
        run: |
          {
            echo "## Published to GHCR"
            echo
            echo "- Image: \`$REPOSITORY:build-$GITHUB_RUN_ID@$DIGEST\`"
            echo
            echo "### Source images"
            echo
            echo "| Status | Tag | Root | Version |"
            echo "| --- | --- | --- | --- |"
            awk -F'\t' 'NR > 1 {
              gsub(/\|/, "\\|")
              print "| " $1 " | " ($2 == "-" ? "-" : "`" $2 "`") " | " $5 " | " $6 " |"
            }' out/sources/plan.tsv
            echo
            echo "### Source indexes"
            echo
            echo "| Subject | Digest | Source index | Source images |"
            echo "| --- | --- | --- | --- |"
            awk -F'\t' '{ print "| " $1 " | `" $2 "` | `" $3 "` | " $4 " |" }' out/sources/indexes.tsv
          } >>"$GITHUB_STEP_SUMMARY"

  promote:
    name: Promote to Quay
    needs: [build, sources]
    # Only runs that tag latest go to Quay. Every other run stays on GHCR. Keep this in step with
    # the build's latest tag.
    if: github.event_name == 'workflow_dispatch' && inputs.latest
    runs-on: ubuntu-26.04
    # Quay's robot federation trusts only this environment's OIDC subject, and only main can
    # deploy to it (docs/integrations/quayio.md).
    environment: quay
    permissions:
      contents: read
      packages: read # copy from GHCR
      id-token: write # Quay robot federation
    defaults:
      run:
        shell: bash
    env:
      DIGEST: ${{ needs.build.outputs.digest }}
      QUAY_ROBOT: frithuz+promote
      QUAY_AUDIENCE: quay
      QUAY_REPOSITORY: quay.io/frithuz/devcontainer
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up ORAS
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        with:
          url: ${{ env.ORAS_URL }}
          checksum: ${{ env.ORAS_CHECKSUM }}

      - name: Set the GHCR repository
        run: echo "GHCR_REPOSITORY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/devcontainer" >>"$GITHUB_ENV"

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      # Exchanges the job's OIDC token for a one-hour Quay token. No Quay credential is stored. The
      # audience must be one of the federation entry's OIDC audiences in Quay.
      - name: Log in to Quay with OIDC federation
        run: |
          oidc=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$QUAY_AUDIENCE" | jq -er .value)
          echo "::add-mask::$oidc"
          token=$(curl -fsS --user "$QUAY_ROBOT:$oidc" https://quay.io/oauth2/federation/robot/token | jq -er .token)
          echo "::add-mask::$token"
          printf '%s' "$token" | oras login quay.io --username "$QUAY_ROBOT" --password-stdin

      # Copied by digest, untagged. Referrers carry the signatures, attestations, and source
      # indexes, and each source index carries its source images, so Quay gets no source-* tags.
      # Quay has the Referrers API, so requiring it makes a Quay-side problem fail instead of
      # creating fallback tags.
      - name: Copy the image with its referrers
        run: oras cp -r --to-distribution-spec v1.1-referrers-api "$GHCR_REPOSITORY@$DIGEST" "$QUAY_REPOSITORY@$DIGEST"

      # No tag in Quay points at the image before its source is there (docs/legal.md#publishing).
      - name: Check the source indexes
        run: scripts/source-indexes.sh check --referrers api "$QUAY_REPOSITORY" "$DIGEST" | tee indexes.tsv

      - name: Tag the image
        run: oras tag "$QUAY_REPOSITORY@$DIGEST" "build-$GITHUB_RUN_ID" latest

      - name: Summary
        run: |
          {
            echo "## Promoted to Quay"
            echo
            echo "- Image: \`$QUAY_REPOSITORY:build-$GITHUB_RUN_ID@$DIGEST\`"
            echo
            echo "### Source indexes"
            echo
            echo "| Subject | Digest | Source index | Source images |"
            echo "| --- | --- | --- | --- |"
            awk -F'\t' '{ print "| " $1 " | `" $2 "` | `" $3 "` | " $4 " |" }' indexes.tsv
          } >>"$GITHUB_STEP_SUMMARY"
