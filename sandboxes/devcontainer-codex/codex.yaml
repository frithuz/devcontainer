# syntax=docker/sandbox-kit:3
# Codex on the devcontainer image. The credential and config seed follow Docker's codex
# workload (github.com/docker/sandbox-kit-spec, examples/codex), without the version
# re-pin and Docker Desktop hooks: the image installs Codex itself. Codex keeps its
# binaries in ~/.codex, so nothing mounts over that directory.
schemaVersion: "3"
displayName: Codex (devcontainer)
description: OpenAI Codex on the frithuz devcontainer image
sourceUrl: https://github.com/frithuz/devcontainer
licenses: [CC0-1.0]

kind: workload

args:
  model:
    default: ""
    pattern: '^[A-Za-z0-9._-]*$'
    description: Codex model to use (config.toml `model`); empty keeps the CLI default
    env: CODEX_MODEL
  reasoningEffort:
    default: ""
    pattern: '^(none|minimal|low|medium|high|xhigh|max|ultra|persistent)?$'
    description: Reasoning effort (config.toml `model_reasoning_effort`); empty keeps the CLI default
    env: CODEX_REASONING_EFFORT

# The version the image installed. The agent may update itself inside the sandbox.
# scripts/update-kits.sh rewrites this line and the dockerfile's FROM together.
provides: ["codex@0.164.0"]

capabilities:
  - type: com.docker.sandbox/sbx@1

  # The agent's API and update hosts (Codex updates from GitHub releases), then the
  # image's apt sources and its toolchains' package registries.
  - type: com.docker.sandbox/network-policy@1
    config:
      # GitHub's SSH host keys, fetched by an install hook below.
      install:
        allow:
          - api.github.com:443
      runtime:
        allow:
          - api.openai.com:443
          - openai.com:443
          - auth.openai.com:443
          - chatgpt.com:443
          - files.openai.com:443
          - releases.openai.com:443
          - api.github.com:443
          - github.com:443
          - release-assets.githubusercontent.com:443
          - codeload.github.com:443
          - deb.debian.org
          - dhi.io:443
          - download.docker.com:443
          - registry.npmjs.org:443
          - pypi.org:443
          - files.pythonhosted.org:443
          - proxy.golang.org:443
          - sum.golang.org:443
          # git over SSH, with the ssh-agent capability below.
          - github.com:22

  # Both apiKey and oauth: the host's binding picks the mode. OAuth model calls go
  # through chatgpt.com, so it's a resource host.
  - type: com.docker.sandbox/credential@1
    optional: true
    description: OpenAI API access (API key or ChatGPT OAuth)
    config:
      service: openai
      phase: runtime
      apiKey:
        name: OPENAI_API_KEY
        proxyManaged: true
        inject:
          - {domain: api.openai.com, header: Authorization, format: "Bearer %s"}
          - {domain: openai.com, header: Authorization, format: "Bearer %s"}
      oauth:
        tokenEndpoint: {host: auth.openai.com, path: /oauth/token}
        resourceHosts:
          - chatgpt.com
        sentinels:
          accessToken: oai-oat01-proxy-managed
          refreshToken: oai-ort01-proxy-managed

  # The host's SSH agent, for git over SSH to GitHub only: logins as git@github.com, and no
  # signatures. Optional, so a host without an agent, or with forwarding off, still gets a
  # sandbox. The host keys the runtime checks the login against come from outside the sandbox.
  - type: com.docker.sandbox/ssh-agent@1
    optional: true
    description: Use the host's SSH keys for git over SSH to GitHub
    config:
      phase: runtime
      unrestricted: false
      authenticate: [git@github.com]

  # SSH commit signing, ported from Docker's git-ssh-sign kit (docker/sbx-kits-contrib,
  # git-ssh-sign/git-ssh-sign.yaml at 44a891f). One optional group, so a host without an SSH
  # agent skips all of it: signing configured with nothing to sign with would fail every commit
  # in a repository with a remote. The agent signs only git's namespace. The image's git is
  # past 2.36, so the upstream hook's version probe and its cleanup of older kit versions are
  # left out.
  - group:
      name: SSH commit signing
      optional: true
      capabilities:
        - type: com.docker.sandbox/ssh-agent@1
          description: Sign git commits and tags with the host's SSH key
          config:
            phase: runtime
            unrestricted: false
            sign: [git]

        # The key command matches the agent's keys against the committer's GitHub signing keys.
        - type: com.docker.sandbox/network-policy@1
          config:
            runtime:
              allow:
                - api.github.com:443

        # The signing machinery is machine-wide. user.signingKey stays unset, or git never runs
        # the key command, which resolves the key from the agent when git signs. Signing itself
        # is on only in repositories with a remote, so test fixtures that `git init` don't need
        # the agent.
        - type: com.docker.sandbox/lifecycle@1
          config:
            install:
              - command: |
                  set -e
                  git config --system gpg.format ssh
                  git config --system gpg.ssh.defaultKeyCommand /usr/local/libexec/git-ssh-sign/ssh-signing-key-command
                  git config --system gpg.ssh.allowedSignersFile /home/agent/.config/git/allowed_signers
                  git config --system --unset-all user.signingKey || true
                  mkdir -p /etc/git
                  printf '[commit]\n\tgpgSign = true\n[tag]\n\tgpgSign = true\n' > /etc/git/signing-enabled.inc
                  chmod 0644 /etc/git/signing-enabled.inc
                  git config --system 'includeIf.hasconfig:remote.*.url:**.path' /etc/git/signing-enabled.inc
                user: "0"
                description: Configure SSH commit signing, scoped to repositories with a remote

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        # Rewritten on every create from the bound auth mode, so it's idempotent. Top-level
        # keys go before the tables. The arg patterns admit no quote or backslash, so
        # they're safe in TOML strings.
        - command: |
            set -e
            mkdir -p /home/agent/.codex /home/agent/.agents
            mode="${SBX_CRED_OPENAI_MODE:-none}"
            cfg=/home/agent/.codex/config.toml
            cat > "$cfg" <<'EOF'
            approval_policy = "never"
            sandbox_mode = "danger-full-access"
            mcp_oauth_credentials_store = "file"
            EOF
            model='${{ kit.args.model }}'
            effort='${{ kit.args.reasoningEffort }}'
            [ -z "$model" ] || printf 'model = "%s"\n' "$model" >> "$cfg"
            [ -z "$effort" ] || printf 'model_reasoning_effort = "%s"\n' "$effort" >> "$cfg"
            case "$mode" in
              oauth|apikey) echo 'forced_login_method = "api"' >> "$cfg" ;;
            esac
            if [ "$mode" = oauth ]; then
              cat >> "$cfg" <<'EOF'
            model_provider = "sandboxd"

            [model_providers.sandboxd]
            name = "Sandbox Proxy"
            base_url = "https://chatgpt.com/backend-api/codex"
            experimental_bearer_token = "oai-oat01-proxy-managed"
            requires_openai_auth = false
            EOF
            fi
            ws="${WORKSPACE_DIR:-/home/agent/workspace}"
            esc=$(printf '%s' "$ws" | sed 's/\\/\\\\/g; s/"/\\"/g')
            cat >> "$cfg" <<EOF

            [projects."$esc"]
            trust_level = "trusted"
            EOF
            case "$mode" in
              oauth|apikey) printf '{\n  "OPENAI_API_KEY": "proxy-managed"\n}\n' > /home/agent/.codex/auth.json ;;
              *) rm -f /home/agent/.codex/auth.json ;;
            esac
          user: agent
          env: [SBX_CRED_OPENAI_MODE, WORKSPACE_DIR]
          description: Seed Codex config and auth from the bound auth mode
        # GitHub's SSH host keys, as the sbx/github-ssh mixin installs them
        # (docker/sbx-kits-contrib), but system-wide and replaced on each install rather than
        # appended to ~/.ssh/known_hosts, so the agent's own file stays untouched. A failed
        # fetch doesn't stop the sandbox: ssh then asks to verify github.com.
        - command: |
            if keys=$(curl -fsS --retry 3 https://api.github.com/meta | jq -er '.ssh_keys[] | "github.com " + .'); then
              printf '%s\n' "$keys" > /etc/ssh/ssh_known_hosts
              chmod 644 /etc/ssh/ssh_known_hosts
            else
              echo "Couldn't fetch GitHub's SSH host keys; ssh will ask to verify github.com" >&2
            fi
          user: "0"
          description: Install GitHub's SSH host keys from api.github.com/meta
      startup:
        # Appended once; a later start finds the table and leaves it alone.
        - command: |
            set -e
            [ -n "$MCP_GATEWAY_URL" ] || exit 0
            cfg="$HOME/.codex/config.toml"
            touch "$cfg"
            grep -q '^\[mcp_servers.mcp-gateway\]' "$cfg" && exit 0
            esc() { printf '%s' "$1" | sed 's/\\/\\\\/g; s/"/\\"/g'; }
            url=$(esc "$MCP_GATEWAY_URL")
            auth=$(esc "$MCP_SENTINEL_TOKEN_NAME")
            cat >> "$cfg" <<EOF

            [mcp_servers.mcp-gateway]
            url = "$url"
            http_headers = { Authorization = "Bearer $auth" }
            EOF
          user: agent
          env: [MCP_GATEWAY_URL, MCP_SENTINEL_TOKEN_NAME]
          description: Register the sandbox MCP gateway in ~/.codex/config.toml

  - type: com.docker.sandbox/agent-sessions@1
    config:
      prompt: ["exec", "--", "{{.Prompt}}"]
      resume: ["resume", "{{.SessionID}}"]
      continue: ["resume", "--last"]

  - type: com.docker.sandbox/agent-interactive-sessions@1
    optional: true
    config:
      prompt: ["--", "{{.Prompt}}"]
      continue: ["resume", "--last"]
      resume: ["resume", "{{.SessionID}}"]
      sessionPicker: ["resume"]

  - type: com.docker.sandbox/agent-skills@1
    optional: true
    config:
      path: /home/agent/.agents/skills

  # sbx v0.50 rejects agent-context@2, so offer both, optional, as Docker's workloads do
  # during its rollout. The runtime selects the one it supports.
  - type: com.docker.sandbox/agent-context@1
    optional: true
    config: &agent-context
      filename: AGENTS.md
      directory: /home/agent/.codex
      content: |
        ## Sandbox environment

        This sandbox runs the frithuz devcontainer image (Debian 13, Docker Hardened Images) with one
        pinned toolset: Go, Node with pnpm, Python with uv, gh, task, jq, yq, and linters
        such as golangci-lint and shfmt. /legal/manifest.tsv lists everything.

        - Persistent environment comes from `BASH_ENV` (/etc/devcontainer/env.sh), not
          shell profiles. Don't rely on `.bashrc` or `/etc/profile`.
        - `go install` and `pnpm add -g` write to shared, group-writable directories that
          are already on `PATH`.
        - Never run `start-dockerd` here. Container access is up to the sandbox.
        - Credentials are proxy-managed. Tokens in local config files are sentinels.
        - git over SSH reaches github.com through the host's SSH agent, when the host
          forwards one. GitHub's host keys are in /etc/ssh/ssh_known_hosts.
        - In a repository with a remote, git signs commits and tags with the host's SSH key,
          when the host forwards an SSH agent. When signing fails, the `[git-ssh-sign]` lines
          name the cause; ignore git's `user.signingKey` error after them. `git -c
          commit.gpgsign=false commit` skips signing once.

  - type: com.docker.sandbox/agent-context@2
    optional: true
    config: *agent-context
